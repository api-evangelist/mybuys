name: Mybuys
description: MyBuys was a San Mateo, California cross-channel retail personalization company founded in
  2002 that delivered coordinated product recommendations and targeted offers across websites, email,
  and display advertising using a patented portfolio of real-time optimization algorithms and an Active
  Shopper Database. MyBuys merged with digital advertising firm Magnetic in 2015, and Magnetic sold the
  MyBuys merchandising/personalization business to Evergage in January 2018. The company is defunct as an
  independent entity; the mybuys.com domain resolves but serves no live product, and there is no
  developer portal, documentation, or public API surface to enrich.
